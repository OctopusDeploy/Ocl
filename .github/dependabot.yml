# Keeps dependencies current so CVE fixes arrive as routine PRs.
version: 2
updates:
  - package-ecosystem: nuget
    directories:
      - "/build"
      - "/source"
      - "/source/Ocl"
      - "/source/Tests"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      nuget:
        patterns:
          - "*"
